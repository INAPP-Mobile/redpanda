<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Redpanda streaming">
  <defs>
    <linearGradient id="stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <!-- abstract red-panda: rounded head + ear tufts + streaming data bands, no text -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#1f2733"/>
  <!-- ear tufts (left/right) -->
  <circle cx="78" cy="80" r="26" fill="url(#stream)" opacity="0.95"/>
  <circle cx="178" cy="80" r="26" fill="url(#stream)" opacity="0.95"/>
  <!-- head/body (rounded) -->
  <rect x="58" y="64" width="140" height="128" rx="44" fill="url(#stream)"/>
  <!-- eyes -->
  <circle cx="98" cy="118" r="13" fill="#1f2733"/>
  <circle cx="158" cy="118" r="13" fill="#1f2733"/>
  <!-- streaming bands across the body (data flow) -->
  <rect x="82" y="150" width="92" height="9" rx="4.5" fill="#1f2733" opacity="0.85"/>
  <rect x="96" y="168" width="64" height="9" rx="4.5" fill="#1f2733" opacity="0.85"/>
  <rect x="82" y="186" width="92" height="9" rx="4.5" fill="#1f2733" opacity="0.85"/>
</svg>
